name: campus-runner

services:
  api:
    image: campus-api:${APP_VERSION:?Set APP_VERSION to an immutable release tag}
    build:
      context: ../server
      dockerfile: ../deploy/api.Dockerfile
    env_file:
      - ${SERVER_ENV_FILE:?Set SERVER_ENV_FILE to the absolute production env path}
    environment:
      NODE_ENV: production
      BIND_HOST: 0.0.0.0
      PORT: '3000'
      TRUST_PROXY_HOPS: '2'
      WECHAT_LOGIN_MODE: wechat
      CONTENT_CHECK_MODE: wechat
    expose:
      - '3000'
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:3000/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  admin:
    image: campus-admin:${APP_VERSION:?Set APP_VERSION to an immutable release tag}
    build:
      context: ../admin
      dockerfile: ../deploy/admin.Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    environment:
      API_UPSTREAM: http://api:3000
    ports:
      - '${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1/ready > /dev/null || exit 1']
      interval: 15s
      timeout: 8s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
